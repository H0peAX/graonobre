<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Grão Nobre — Administração</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Login -->
  <section class="login hidden" id="loginView">
    <h2>🔒 Administração</h2>
    <p class="note">Grão Nobre · acesso restrito</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pass">Senha</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn btn--block" id="loginBtn">Entrar</button>
    <p class="note" style="margin-top:14px">Demonstração: <b>admin@graonobre.com</b> / <b>admin123</b></p>
  </section>

  <!-- Painel -->
  <div class="hidden" id="appView">
    <header class="admin-bar">
      <div class="logo">GRÃO <span>NOBRE</span> · Admin</div>
      <div><small id="who"></small><button class="btn btn--ghost btn--sm" id="logoutBtn">Sair</button></div>
    </header>

    <main class="container">
      <div class="tabs">
        <button class="tab tab--on" data-tab="products">Produtos</button>
        <button class="tab" data-tab="orders">Pedidos</button>
        <span class="tabs__spacer"></span>
        <button class="btn" id="newBtn">+ Novo produto</button>
      </div>
      <div class="panel" id="panel"></div>
    </main>
  </div>

  <!-- Modal de produto -->
  <div class="modal" id="modal">
    <div class="modal__box">
      <h2 id="mTitle">Novo produto</h2>
      <input type="hidden" id="fId">

      <label for="fName">Nome *</label>
      <input id="fName" maxlength="80">

      <label for="fDesc">Descrição</label>
      <textarea id="fDesc" rows="2" maxlength="300"></textarea>

      <div class="row">
        <div><label for="fCat">Categoria *</label><input id="fCat" list="cats" placeholder="Grãos, Kits..."><datalist id="cats"></datalist></div>
        <div><label for="fEmoji">Emoji</label><input id="fEmoji" maxlength="4" placeholder="☕"></div>
      </div>
      <div class="row">
        <div><label for="fOrigin">Origem</label><input id="fOrigin"></div>
        <div><label for="fRoast">Torra</label><input id="fRoast" placeholder="Média"></div>
      </div>
      <div class="row">
        <div><label for="fPrice">Preço (R$) *</label><input id="fPrice" type="number" step="0.01" min="0"></div>
        <div><label for="fWeight">Peso (g)</label><input id="fWeight" type="number" min="0"></div>
        <div><label for="fStock">Estoque</label><input id="fStock" type="number" min="0"></div>
      </div>

      <div class="check"><input type="checkbox" id="fActive" checked><label for="fActive">Visível na loja</label></div>
      <div class="err" id="fErr"></div>
      <div class="row">
        <button class="btn btn--ghost" id="mCancel">Cancelar</button>
        <button class="btn" id="mSave">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
